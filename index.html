<title>Solicitação e Acompanhamento CentralGov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho das 5 fases no topo · índice à esquerda · cartão do passo (o que fazer + tela recriada com o botão marcado) */
:root{
  --ground:#EEF2F7; --surface:#FFFFFF; --sunken:#F5F7FA;
  --ink:#0F1E33; --ink-2:#3B4B60; --muted:#66778C;
  --rule:#D9E1EA; --rule-2:#B9C5D3;
  --gov:#1351B4; --gov-deep:#0C326F; --gov-soft:#E5EEFB;
  --mark:#FFCD07; --mark-ink:#5A4500; --mark-soft:#FFF6CC;
  --ok:#168821; --ok-soft:#E3F4E5;
  --warn:#B25E00; --warn-soft:#FCEFDD;
  --stop:#C2261B; --stop-soft:#FCE9E7;
  --f-display:"Lexend",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --t-xs:.78rem; --t-sm:.9rem; --t-md:1.05rem; --t-lg:1.3rem; --t-xl:clamp(1.55rem,1.25rem+1.2vw,2.15rem);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1320; --surface:#121D2D; --sunken:#17243A;
    --ink:#E8EEF6; --ink-2:#BCC8D8; --muted:#8C9CB1;
    --rule:#22324A; --rule-2:#344862;
    --gov:#7FAAF2; --gov-deep:#B9D0F8; --gov-soft:#16294A;
    --mark:#FFD84A; --mark-ink:#FFE58A; --mark-soft:#2E2710;
    --ok:#6CCB75; --ok-soft:#132A18;
    --warn:#F0AE5C; --warn-soft:#2D2111;
    --stop:#F2928A; --stop-soft:#2F1918;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B1320; --surface:#121D2D; --sunken:#17243A;
  --ink:#E8EEF6; --ink-2:#BCC8D8; --muted:#8C9CB1;
  --rule:#22324A; --rule-2:#344862;
  --gov:#7FAAF2; --gov-deep:#B9D0F8; --gov-soft:#16294A;
  --mark:#FFD84A; --mark-ink:#FFE58A; --mark-soft:#2E2710;
  --ok:#6CCB75; --ok-soft:#132A18;
  --warn:#F0AE5C; --warn-soft:#2D2111;
  --stop:#F2928A; --stop-soft:#2F1918;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:1.02rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* ---------- topo ---------- */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--rule)}
.topo-in{max-width:1200px;margin-inline:auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.marca{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.selo{width:36px;height:36px;border-radius:10px;background:var(--gov);display:grid;place-items:center;flex:none}
.selo svg{width:20px;height:20px}
.marca-t{display:flex;flex-direction:column;min-width:0;flex:1}
.marca-t b{font-family:var(--f-display);font-weight:600;font-size:var(--t-md);line-height:1.2}
.marca-t span{font-size:var(--t-xs);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.trilho{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.trilho::-webkit-scrollbar{display:none}
.fase{flex:1;min-width:118px;border:0;background:none;cursor:pointer;text-align:left;padding:6px 4px 10px;display:flex;flex-direction:column;gap:6px}
.fase i{display:block;height:5px;border-radius:3px;background:var(--rule)}
.fase span{font-size:var(--t-xs);color:var(--muted);font-weight:600;white-space:nowrap}
.fase span em{font-style:normal;font-family:var(--f-mono);margin-right:5px}
.fase.feita span{color:var(--ink-2)}

.fase.atual span{color:var(--gov);}

/* ---------- corpo ---------- */
.wrap{max-width:1200px;margin-inline:auto;padding-inline:16px;padding-block:22px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.indice{order:2}}

.indice{position:static;display:flex;flex-direction:column;gap:10px;overflow:visible}
@media (min-width:901px) and (min-height:900px){.indice{position:sticky;top:128px}}

.grupo{display:flex;flex-direction:column;gap:2px}
.grupo>strong{font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px;font-weight:700}
.indice button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:var(--t-sm);color:var(--ink-2);line-height:1.3}
.indice button:hover{background:var(--surface)}
.indice button em{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);min-width:1.4em}
.indice button[aria-current="true"]{background:var(--gov);color:#fff;font-weight:600}
.indice button[aria-current="true"] em{color:#fff;opacity:.8}

/* ---------- cartão do passo ---------- */
.passo{display:flex;flex-direction:column;gap:20px;min-width:0}
.cab{display:flex;flex-direction:column;gap:6px}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--t-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gov)}
.eyebrow .n{font-family:var(--f-mono);background:var(--gov-soft);color:var(--gov);border-radius:6px;padding:2px 7px;letter-spacing:0}
.cab h2{font-size:var(--t-xl);line-height:1.15;letter-spacing:-.01em}
.cab p{margin:0;color:var(--ink-2);max-width:64ch;font-size:var(--t-md)}
.cab p b{color:var(--ink)}

.corpo{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px;align-items:start}
.corpo.so{grid-template-columns:minmax(0,1fr)}
@media (max-width:1060px){.corpo{grid-template-columns:minmax(0,1fr)}}

.faca{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px}
.faca h3{font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:var(--f-body)}
.faca ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:f}
.faca li{counter-increment:f;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.faca li::before{content:counter(f);width:28px;height:28px;border-radius:50%;background:var(--gov);color:#fff;font-family:var(--f-display);font-weight:600;font-size:.85rem;display:grid;place-items:center}
.faca li b{color:var(--ink)}
.faca li span{color:var(--ink-2)}

/* ---------- telas recriadas ---------- */
.tela{border:1px solid var(--rule-2);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:0 1px 0 var(--rule),0 10px 28px -18px rgba(12,50,111,.35)}
.tela-et{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sunken);font-size:var(--t-xs);color:var(--muted)}
.tela-et .pts{display:flex;gap:4px}
.tela-et .pts i{width:8px;height:8px;border-radius:50%;background:var(--rule-2)}
.tela-et .url{font-family:var(--f-mono);font-size:.72rem;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tela-sc{overflow-x:auto}
.tela-in{padding:18px;min-width:470px}
.tela.livre .tela-in{min-width:0}
.legenda{font-size:var(--t-xs);color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:-10px}
.legenda i{width:14px;height:14px;border-radius:4px;border:2.5px solid var(--mark);display:inline-block}

/* marcador "clique aqui" */
.alvo{position:relative;outline:3px solid var(--mark);outline-offset:3px;border-radius:8px}
.alvo.r{border-radius:999px}
.alvo::after{content:attr(data-tag);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);background:var(--mark);color:#3A2C00;font:700 .68rem/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:2}
.alvo.abaixo::after{bottom:auto;top:calc(100% + 9px)}
@media (prefers-reduced-motion:no-preference){.alvo{animation:pulso 2.2s ease-in-out infinite}}
@keyframes pulso{0%,100%{outline-color:var(--mark)}50%{outline-color:transparent}}

.ui-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule);font-size:.86rem;color:var(--gov)}
.ui-bar .ics{display:flex;gap:8px}
.una{font-family:var(--f-display);font-weight:700;color:var(--gov);letter-spacing:.12em;font-size:.95rem}
.ui-h{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:14px 0 10px;display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.ui-h code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:400}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.abas span{padding:8px 12px;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas span.on{color:var(--gov);border-bottom-color:var(--gov);font-weight:600}
.acoes{display:flex;gap:10px;padding:16px 0 4px;flex-wrap:wrap}
.ico{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule-2);color:var(--gov);display:grid;place-items:center;flex:none;background:var(--surface)}
.ico svg{width:16px;height:16px}
.ico.g{color:var(--ok)} .ico.r{color:var(--stop)} .ico.a{color:var(--warn)}
.ico.cheio{background:var(--gov);border-color:var(--gov);color:#fff}

.campo{border:1px solid var(--rule-2);background:var(--sunken);border-radius:8px;padding:9px 11px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.campo.alto{min-height:66px;align-items:flex-start}
.campo.erro{border-color:var(--stop)}
.rotulo{font-size:.8rem;color:var(--ink-2);margin:12px 0 4px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gov);color:#fff;padding:7px 18px;font-size:.87rem;font-weight:600;border-radius:999px;white-space:nowrap}
.btn.v{background:transparent;color:var(--gov);border:1.5px solid var(--gov)}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.obg{font-size:.76rem;color:var(--stop);margin-top:4px}
.regras{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-size:.8rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;margin-top:10px}
.ficticio{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);border:1px dashed var(--rule-2);border-radius:4px;padding:0 5px;margin-left:4px}

.menu{border:1px solid var(--rule);border-radius:8px;width:230px;overflow:hidden}
.menu div{padding:9px 12px;font-size:.88rem;border-bottom:1px solid var(--rule);color:var(--ink-2);display:flex;justify-content:space-between}
.menu div:last-child{border-bottom:0}
.menu div.on{color:var(--gov);font-weight:600}
.menu div.sub{padding-left:26px;background:var(--gov-soft);color:var(--gov-deep);font-weight:600}

.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:0;padding-top:4px}
.grade div{display:flex;flex-direction:column;gap:1px}
.grade dt{font-size:.76rem;color:var(--gov);font-weight:600}
.grade dd{margin:0;font-size:.88rem}
.grade div.chave{background:var(--mark-soft);border-radius:6px;padding:4px 6px;margin:-4px -6px}

.contadores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cont{border-radius:8px;padding:9px 10px;background:var(--gov-soft);display:flex;gap:8px;align-items:baseline}
.cont b{font-family:var(--f-display);font-size:1.35rem;font-weight:600;color:var(--gov);font-variant-numeric:tabular-nums}
.cont span{font-size:.78rem;color:var(--ink-2);line-height:1.2}
.cont.forte{background:var(--gov)} .cont.forte b,.cont.forte span{color:#fff}
.cont.alerta b{color:var(--stop)}

.check{display:flex;flex-direction:column;gap:12px}
.check>div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.check .m{width:30px;height:30px;border-radius:8px;border:2px solid var(--gov);color:var(--gov);display:grid;place-items:center}
.check .m svg{width:16px;height:16px}
.check b{font-family:var(--f-display);font-weight:500}
.check p{margin:2px 0 0;font-size:.9rem;color:var(--ink-2)}

/* ---------- avisos ---------- */
.avisos{display:flex;flex-direction:column;gap:10px}
.nota{border-radius:12px;padding:13px 16px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;background:var(--gov-soft)}
.nota .i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gov);color:#fff}
.nota .i svg{width:14px;height:14px}
.nota strong{display:block;font-family:var(--f-display);font-weight:600;font-size:.95rem;color:var(--gov-deep)}
.nota p{margin:2px 0 0;color:var(--ink-2)}
.nota.cuide{background:var(--warn-soft)} .nota.cuide .i{background:var(--warn)} .nota.cuide strong{color:var(--warn)}
.nota.trava{background:var(--stop-soft)} .nota.trava .i{background:var(--stop)} .nota.trava strong{color:var(--stop)}

/* ---------- decisão ---------- */
.ramos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.ramos{grid-template-columns:minmax(0,1fr)}}
.ramo{text-align:left;border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:16px;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;align-items:start;transition:border-color .15s,transform .15s}
.ramo:hover{border-color:var(--gov);transform:translateY(-1px)}
.ramo .ico{width:44px;height:44px;grid-row:span 3}
.ramo .ico svg{width:20px;height:20px}
.ramo .q{font-size:.86rem;color:var(--muted)}
.ramo b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.ramo .d{font-size:.9rem;color:var(--ink-2)}
.ramo.ok b{color:var(--ok)} .ramo.warn b{color:var(--warn)} .ramo.stop b{color:var(--stop)} .ramo.blue b{color:var(--gov)}
.ramo.ok .ico{border-color:var(--ok)} .ramo.warn .ico{border-color:var(--warn)} .ramo.stop .ico{border-color:var(--stop)} .ramo.blue .ico{border-color:var(--gov)}

/* ---------- visão geral ---------- */
.mapa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:m}
@media (max-width:760px){.mapa{grid-template-columns:minmax(0,1fr)}}
.etapa{border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.etapa:hover{border-color:var(--gov)}
.etapa .num{font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--gov);line-height:1}
.etapa b{font-family:var(--f-display);font-weight:600}
.etapa span{font-size:.86rem;color:var(--ink-2)}
.etapa.fim{background:var(--gov);border-color:var(--gov)}
.etapa.fim .num,.etapa.fim b,.etapa.fim span{color:#fff}

.cola{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cola{grid-template-columns:minmax(0,1fr)}}
.cola section{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.cola h3{font-size:1rem}
.cola ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink-2);font-size:.95rem}
.cola ul b{color:var(--ink)}
.tab{width:100%;border-collapse:collapse;font-size:.92rem}
.tab td{padding:7px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab td:first-child{font-weight:600;white-space:nowrap;padding-right:12px}
.tab .ok{color:var(--ok)} .tab .warn{color:var(--warn)} .tab .stop{color:var(--stop)} .tab .blue{color:var(--gov)}

/* ---------- navegação ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:1200px;margin-inline:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.nav button{background:var(--gov);color:#fff;border:0;padding:10px 22px;font-weight:600;border-radius:999px;cursor:pointer;font-size:.95rem}
.nav button.sec{background:transparent;color:var(--gov);border:1.5px solid var(--gov)}
.nav button[disabled]{opacity:.35;cursor:default}
.nav .cont-p{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:center}
.nav .dica{display:block;font-family:var(--f-body);font-size:.72rem}
@media (max-width:560px){.nav .dica{display:none}.nav button{padding:10px 16px}}


/* ---------- telas reais ---------- */
.fotos{display:flex;flex-direction:column;gap:18px;min-width:0}
.foto{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.foto .zoom{display:block;width:100%;padding:0;border:1px solid var(--rule-2);border-radius:12px;background:#fff;overflow:hidden;cursor:zoom-in;box-shadow:0 1px 0 var(--rule),0 12px 30px -20px rgba(12,50,111,.45);transition:border-color .15s}
.foto .zoom:hover{border-color:var(--gov)}
.foto img{display:block;width:100%;height:auto}
.foto.estreita .zoom{max-width:330px}
.foto figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.foto figcaption b{font-family:var(--f-mono);font-weight:500;color:var(--gov);margin-right:6px}
.foto .amp{color:var(--muted);font-size:.8rem}
.origem{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.origem i{width:16px;height:12px;border:2.5px solid #E1251B;display:inline-block;border-radius:2px}
.lupa{position:fixed;inset:0;z-index:50;background:rgba(8,16,30,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lupa[hidden]{display:none}
.lupa img{max-width:100%;max-height:calc(100% - 50px);object-fit:contain;border-radius:8px;background:#fff}
.lupa button{background:#fff;color:#0F1E33;border:0;border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer}

/* ---------- separação: índice e conteúdo como painéis ---------- */
.indice{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 10px;box-shadow:0 8px 24px -20px rgba(12,50,111,.5)}
.indice .grupo+.grupo{border-top:1px solid var(--rule);padding-top:8px}
.indice button:hover{background:var(--gov-soft)}
.passo{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:0 0 26px;overflow:hidden;box-shadow:0 14px 34px -24px rgba(12,50,111,.55)}
.passo>*{margin-inline:26px}
.passo>.cab{margin:0;padding:22px 26px 20px;background:var(--gov-soft);border-bottom:1px solid var(--rule)}
@media (max-width:600px){.passo>*{margin-inline:16px}.passo>.cab{padding:18px 16px}}
.faca{background:var(--sunken);border-color:var(--rule)}
.etapa,.ramo,.cola section{background:var(--sunken)}
.etapa:hover,.ramo:hover{background:var(--surface)}
.etapa.fim,.etapa.fim:hover{background:var(--gov)}
.nota{border:1px solid var(--rule)}

.inicio{display:inline-flex;align-items:center;gap:8px;background:var(--gov-soft);color:var(--gov);border:1.5px solid var(--gov);border-radius:999px;padding:7px 16px;font-weight:600;font-size:.9rem;cursor:pointer;flex:none}
.inicio svg{width:17px;height:17px}
.inicio:hover{background:var(--gov);color:#fff}
.inicio[aria-current="true"]{background:var(--gov);color:#fff}
@media (max-width:520px){.inicio{padding:7px 12px}.inicio .t{display:none}}
.selo{cursor:pointer}

function desenharSetas(root){
  const svg = root.querySelector(".setas-liga");
  if (!svg) return;
  svg.innerHTML = "";
  const corpo = root.querySelector(".corpo");
  const colEsq = root.querySelector(".col-esq");
  const itens = root.querySelectorAll(".faca > ol > li");
  const fotos = root.querySelectorAll(".col-esq ~ div .foto");
  if (!corpo || !colEsq || !itens.length || !fotos.length) return;
  const cb = corpo.getBoundingClientRect();
  const eb = colEsq.getBoundingClientRect();
  const fwrap = fotos[0].closest(".col-esq ~ div");
  if (!fwrap) return;
  const wb = fwrap.getBoundingClientRect();
  // só desenha se as fotos estiverem realmente ao lado do texto (layout em 2 colunas), nunca empilhadas embaixo
  if (wb.left < eb.right - 2 || wb.width < 10) return;
  const cor = getComputedStyle(root).getPropertyValue("--c").trim() || "#0B7FA8";
  svg.innerHTML = '<defs><marker id="seta-pt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="' + cor + '"/></marker></defs>';
  const n = Math.min(itens.length, fotos.length);
  for (let k=0; k<n; k++){
    const lb = itens[k].getBoundingClientRect(), fb = fotos[k].getBoundingClientRect();
    if (fb.left < lb.right) continue;
    const x1 = lb.left - cb.left + 14, y1 = lb.top - cb.top + 14;
    const x2 = fb.left - cb.left, y2 = fb.top - cb.top + Math.min(26, fb.height/2);
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2-10} ${y2}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", cor);
    path.setAttribute("stroke-width", "2.5");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", ".55");
    path.setAttribute("marker-end", "url(#seta-pt)");
    svg.appendChild(path);
  }
}

function initSeq(root, lista){
  const z=root.querySelector(".seq-zoom"), im=z.querySelector("img"), num=root.querySelector(".seq-num"), tx=root.querySelector(".seq-txt"), ct=root.querySelector(".seq-cont");
  let k=0;
  const show=n=>{ k=(n+lista.length)%lista.length; const f=lista[k]; im.src=IMG[f[0]]; im.alt=f[1]; z.dataset.k=f[0]; num.textContent=k+1; tx.textContent=f[1]; ct.textContent=`${k+1} de ${lista.length}`; root.querySelectorAll(".seq-t").forEach((t,j)=>t.classList.toggle("on",j===k)); subMark(k); };
  root.querySelectorAll(".seq-bt").forEach(b=>b.addEventListener("click",()=>show(k+ +b.dataset.d)));
  root.querySelectorAll(".seq-t").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));
}

function notasHTML(ns){
  if(!ns) return "";
  return `<div class="avisos">${ns.map(n=>`<div class="nota ${n.k}"><span class="i">${n.k==='trava'?S.trava:n.k==='cuide'?S.alerta:S.info}</span><div><strong>${n.t}</strong><p>${typeof n.p==="function"?n.p():n.p}</p></div></div>`).join("")}</div>`;
}

   '<svg viewBox="0 0 24 24"><path d="M4 20 20 12 4 4l2.5 8L4 20z"/><path d="M6.5 12H13"/></svg>',

function render(){
  const p = PASSOS[i];
  let html;
  if (p.abertura) html = abertura();
  else if (p.mapa) html = visaoGeral();
  else if (p.cola) html = cola();
  else {
    const fase = FASES[p.f];
    const dentro = PASSOS.filter(x=>x.f===p.f);
    const pos = dentro.indexOf(p)+1;
    html = p.extra ? `<div class="cab"><h2 class="h-info">${ICO_INFO}<span>Precisa ajustar ou desistir da solicitação?</span></h2></div>` : `<div class="cab"><div class="eyebrow"><span class="n">Passo ${i}</span>${fase}</div><h2>${p.t}</h2>${p.lead?`<p>${p.lead}</p>`:""}</div>${p.antes?notasHTML(p.antes):""}`;
    if (p.antesHTML) html += p.antesHTML;
    if (p.decisao) html += decisao();
    else {
      const temVis = !!(FOTOS[i] || p.tela);
      html += `<div class="corpo${p.faca && temVis?'':' so'}">`;
      if (p.ligarFigs) html += '<svg class="setas-liga" aria-hidden="true"></svg>';
      if (p.faca) html += `<div class="col-esq${temVis?'':' lado'}"><div class="faca${p.facaTit?" info-canc":""}"><h3>${p.facaTit||"O que fazer"}</h3><ol>${p.faca.map(x=>`<li><div>${x}</div></li>`).join("")}</ol></div>${notasHTML(p.notas)}</div>`;
      html += (temVis ? `<div style="display:flex;flex-direction:column;gap:20px;min-width:0">${FOTOS[i]?(p.subOr?gruposHTML(p,FOTOS[i]):(FOTOS[i].seq?(FOTOS[i].lista.length>1?listaHTML(FOTOS[i].lista):seqHTML(FOTOS[i]).replace('<button class="zoom seq-zoom"', (p.sobFoto||"")+'<button class="zoom seq-zoom"')):(p.sobFoto||"")+fotosHTML(FOTOS[i]))):p.tela}</div>` : "") + `</div>`;
      if (!p.faca) html += notasHTML(p.notas);
      if (p.depois) html += `<div class="depois">${p.depois()}</div>`;
    }
  }
  if (i>0){
    const ant = PASSOS[i-1], prox = p.cola ? null : PASSOS[i+1];
    html += `<div class="seguir-mini">
      ${prox?`<button class="prox-el" data-ir="${i+1}"><span>${p.av||prox.t}</span><i aria-hidden="true">→</i></button>`:`<button class="prox-el" data-ir="0"><span>Voltar ao início</span><i aria-hidden="true">→</i></button>`}
    </div>`;
  }
  elPasso.innerHTML = html;
  const eb = elPasso.querySelector(".eyebrow");
  if (eb && !p.abertura) eb.insertAdjacentHTML("beforeend", `<span class="teclas">Use as setas <kbd>←</kbd> <kbd>→</kbd> do teclado para voltar e avançar</span>`);
  elPasso.style.setProperty("--c", p.f>=0 ? CORES[p.f] : "#1351B4");
  if (FOTOS[i] && FOTOS[i].seq) elPasso.querySelectorAll(".seq").forEach(r=>initSeq(r,FOTOS[i].lista));
  if (p.ligarFigs) requestAnimationFrame(()=>desenharSetas(elPasso));
  elPasso.querySelectorAll(".zoom").forEach(b=>b.addEventListener("click",()=>abrir(b.dataset.k,b.querySelector("img").alt)));
  elPasso.querySelectorAll("[data-ir]").forEach(b=>b.addEventListener("click",()=>ir(+b.dataset.ir)));

  visitados.add(i);
  elIndice.querySelectorAll("button").forEach(b=>{ b.setAttribute("aria-current", +b.dataset.n===i?"true":"false"); b.classList.toggle("feito", visitados.has(+b.dataset.n) && PASSOS[+b.dataset.n].f>=0 && PASSOS[i].f!==-1 && +b.dataset.n!==i); });

  const faseAtual = p.f<=-3 || p.f===-1 ? -1 : p.f===-2 ? 5 : p.f;
  elTrilho.querySelectorAll(".fase").forEach((b,f)=>{
    b.classList.toggle("feita", f<faseAtual);
    b.classList.toggle("atual", f===faseAtual);
    let pct = 0;
    if (f<faseAtual) pct = 100;
    else if (f===faseAtual){ const d = PASSOS.filter(x=>x.f===f); pct = Math.round((d.indexOf(p)+1)/d.length*100); }
    b.style.setProperty("--p", pct+"%");
  });


  $("inicio").setAttribute("aria-current", i===0?"true":"false");
  if (typeof IDX_DESF!=="undefined"){
    const pp=PASSOS[i];
    $("nav-resumo").setAttribute("aria-current", pp.cola?"true":"false");
    const n = pp.f>=0 ? PASSOS.slice(0,i+1).filter(x=>x.f>=0).length : 0;
    $("prog-t").textContent = n ? `Passo ${n} de ${TOT}` : `${TOT} passos`;
    $("prog-b").style.width = (n/TOT*100)+"%";
    const C = 2*Math.PI*18, cor = pp.f>=0 ? CORES[pp.f] : "#1351B4";
    $("ring-v").style.strokeDasharray = C; $("ring-v").style.strokeDashoffset = C*(1-n/TOT); $("ring-v").style.stroke = cor;
    $("ring-t").textContent = pp.cola ? "✓" : n;
    $("ring-f").textContent = pp.f>=0 ? `Fase ${pp.f+1} · ${FASES[pp.f]}` : (pp.cola ? "Dicas e informações" : pp.extra ? "Informação adicional" : "Início");
    $("ring-f").style.color = pp.f>=0 ? cor : "";
    $("ring-s").textContent = n ? `Passo ${n} de ${TOT}` : `${TOT} passos em ${FASES.length} fases`;
    $("mig").textContent = pp.mapa ? "Início" : pp.t; document.querySelectorAll(".onde").forEach(e=>e.style.visibility = pp.mapa ? "hidden" : ""); document.body.classList.toggle("na-capa", !!pp.mapa); document.body.classList.toggle("em-passo", pp.f>=0); setTimeout(()=>subMark(0),0);
    document.querySelectorAll("#flinha i").forEach((el,f)=>{ el.style.background = (pp.f>=0 && f<=pp.f) || pp.cola ? CORES[f] : ""; el.classList.toggle("cur", f===pp.f); });
  }
  try{ localStorage.setItem("manual-usuario-passo", String(i)); }catch(e){}
}

function ir(n){
  i = Math.max(0, Math.min(PASSOS.length-1, n));
  render();
  if (!document.activeElement || document.activeElement===document.body || !document.contains(document.activeElement)) elPasso.focus({preventScroll:true});
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

function rotuloPasso(n){
  const p = PASSOS[n];
  if (!p || p.f < 0) return String(n);
  const dentro = PASSOS.filter(x=>x.f===p.f);
  return (p.f+1) + '.' + (dentro.indexOf(p)+1);
}
function montar(){
  elTrilho.innerHTML = FASES.map((f,n)=>`<button class="fase" data-ir="${primeiroDaFase(n)}"><i></i><span><em>${n+1}</em>${f}</span></button>`).join("");
  elTrilho.querySelectorAll(".fase").forEach(b=>b.addEventListener("click",()=>ir(+b.dataset.ir)));

  let h = ``;
  FASES.forEach((nome,f)=>{
    h += `<div class="grupo" style="--c:${CORES[f]}"><strong><i></i>${f+1} · ${nome}</strong>`;
    PASSOS.forEach((p,n)=>{ if(p.f===f){ h += `<button data-n="${n}"><em>${rotuloPasso(n)}</em><span>${p.t}</span></button>`; if(p.sub && !p.subOr) h += `<ol class="sub" data-sn="${n}">${p.sub.map((t,k)=>`<li role="button" tabindex="0" data-sn="${n}" data-sk="${k}"><b>${rotuloPasso(n)+'.'+(k+1)}</b><span>${t}</span></li>`).join("")}</ol>`; } });
    h += `</div>`;
  });
  h += `<div class="grupo extra-g" style="--c:#66778C">`;
  PASSOS.forEach((p,n)=>{ if(p.extra) h += `<button data-n="${n}"><em class="em-info">${ICO_INFO}</em><span>${p.rotulo||p.t}</span></button>`; });
  h += `</div>`;
  elIndice.innerHTML = h;
  elIndice.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>ir(+b.dataset.n)));
}


const lupa=$("lupa"), lupaImg=$("lupa-img");
const TELAS = []; Object.keys(FOTOS).map(Number).sort((a,b)=>a-b).forEach(n=>{ const L = FOTOS[n].seq ? FOTOS[n].lista : FOTOS[n]; L.forEach(f=>TELAS.push({k:f[0], leg:f[2]||f[1], n})); }); TELAS_EXTRA.forEach(t=>TELAS.push(t));
let tAtual = 0;
function mostrarTela(x){
  tAtual = (x + TELAS.length) % TELAS.length;
  const t = TELAS[tAtual], p = PASSOS[t.n];
  lupaImg.src = IMG[t.k]; lupaImg.alt = t.leg;
  lupa.dataset.k = t.k;
  $("lupa-prox").classList.toggle("ver", !!(TELAS[tAtual+1] && TELAS[tAtual+1].n === t.n));
  lupaImg.onload = posicionarSetas;
  requestAnimationFrame(posicionarSetas);
  $("lupa-pas").innerHTML = p.f>=0 ? `<i class="lp-n">${rotuloPasso(t.n)}</i>${p.t}` : (p.extra ? (p.rotulo||p.t) : p.t);
  $("lupa-pas").style.background = CORES[p.f] || "#4B5B70";
  $("lupa-leg").textContent = t.leg;
  $("lupa-cont").textContent = `Tela ${tAtual+1} de ${TELAS.length}`;
}
function abrir(k,alt){ let x = TELAS.findIndex(t=>t.k===k && t.n===i); if (x<0) x = TELAS.findIndex(t=>t.k===k); mostrarTela(Math.max(0,x)); lupa.hidden=false; $("lupa-x").focus(); requestAnimationFrame(posicionarSetas); }
function posicionarSetas(){
  if (lupa.hidden) return;
  const r = lupaImg.getBoundingClientRect();
  if (!r.width) return;
  const y = r.top + r.height/2;
  const prox = $("lupa-prox"), ant = $("lupa-ant");
  prox.style.top = (y - 32) + "px";
  ant.style.top = (y - 32) + "px";
  prox.style.left = Math.min(window.innerWidth - 80, r.right + 14) + "px";
  ant.style.left = Math.max(16, r.left - 78) + "px";
}
window.addEventListener("resize", ()=>{ if (!lupa.hidden) posicionarSetas(); });
function fechar(){ lupa.hidden=true; }
lupa.addEventListener("click",e=>{ if (e.target===lupa || e.target.id==="lupa-x" || e.target.classList.contains("lupa-meio")) fechar(); });
$("lupa-ant").addEventListener("click",e=>{ e.stopPropagation(); mostrarTela(tAtual-1); });
$("lupa-prox").addEventListener("click",e=>{ e.stopPropagation(); mostrarTela(tAtual+1); });
document.addEventListener("keydown",e=>{ if (lupa.hidden) return; if (e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !lupa.hidden) fechar(); },true);

$("inicio").addEventListener("click",()=>ir(0));
const IDX_DESF = PASSOS.findIndex(p=>p.decisao), TOT = PASSOS.filter(p=>p.f>=0).length;
$("nav-resumo").addEventListener("click",()=>ir(PASSOS.findIndex(x=>x.cola)));
document.querySelector(".selo").addEventListener("click",()=>ir(0));
document.addEventListener("keydown",e=>{ if(e.key==="Home" && lupa.hidden && !e.target.matches("input,textarea,select")) ir(0); });
document.addEventListener("keydown",e=>{
  if (e.target.matches("input,textarea,select") || !lupa.hidden) return;
  if (e.key==="ArrowRight"){ e.preventDefault(); ir(i+1); }
  if (e.key==="ArrowLeft"){ e.preventDefault(); ir(i-1); }
});
/* garante que a página receba as setas sem precisar clicar antes */
function pegarFoco(){ try{ window.focus(); }catch(e){} if (!document.activeElement || document.activeElement===document.body) elPasso.focus({preventScroll:true}); }
window.addEventListener("load", pegarFoco);
document.addEventListener("mouseenter", pegarFoco);
document.addEventListener("mousemove", function m(){ pegarFoco(); document.removeEventListener("mousemove", m); });

montar();
const m = /^#passo(\d+)$/.exec(location.hash);
if (m) i = Math.min(PASSOS.length-1, +m[1]);
else i = 0;
render();
</script>
